name: EASUN RWB1 Local Bridge
version: "0.1.9"
slug: easun_rwb1
description: >-
  Serve the EASUN RWB1 (Siseli) dongle locally — answers DNS and the HTTP
  bootstrap and publishes the inverter data to Home Assistant over MQTT,
  with no cloud and no internet.
url: "https://github.com/zaskar2097/easun_rwb1"
arch:
  - aarch64
  - armv7
  - armhf
  - amd64
  - i386
init: false
host_network: true
startup: services
boot: auto
# Needs the MQTT broker (Mosquitto) to publish the sensors and exchange
# messages with the dongle.
services:
  - mqtt:want
ports:
  "8553/udp": 8553
  "80/tcp": 80
ports_description:
  "8553/udp": "DNS — answers the cloud domains with the Pi's IP (high port so it doesn't clash with 53)"
  "80/tcp": "HTTP — serves the dongle bootstrap (checkin/findSingle/servers)"
options:
  pi_ip: ""
  mqtt_host: "127.0.0.1"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  override_substr: "siseli"
  dns_port: 8553
  dns_upstream: "1.1.1.1"
  refresh_interval: 20
  report_period_ms: 60000
  dev_sn: ""
  log_level: "info"
schema:
  pi_ip: "str?"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_user: "str?"
  mqtt_password: "password?"
  override_substr: "str"
  dns_port: "port"
  dns_upstream: "str"
  refresh_interval: "int(0,3600)"
  report_period_ms: "int(10000,600000)"
  dev_sn: "str?"
  log_level: "list(debug|info|warning|error)"
