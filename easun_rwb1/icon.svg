<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f45"/>
      <stop offset="0.5" stop-color="#23272c"/>
      <stop offset="1" stop-color="#15181b"/>
    </linearGradient>
  </defs>

  <!-- soft rounded background -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#f4f7fa"/>

  <!-- ===== RJ45 connector (top) ===== -->
  <g stroke="#1f2328" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="104" y="30" width="48" height="46" rx="6" fill="#dfe8ee"/>
    <path d="M118 30 v-9 a4 4 0 0 1 4-4 h12 a4 4 0 0 1 4 4 v9" fill="#dfe8ee"/>
    <g stroke="#e3a43b" stroke-width="4">
      <line x1="114" y1="40" x2="114" y2="60"/>
      <line x1="122" y1="40" x2="122" y2="60"/>
      <line x1="130" y1="40" x2="130" y2="60"/>
      <line x1="138" y1="40" x2="138" y2="60"/>
    </g>
  </g>

  <!-- ===== body ===== -->
  <rect x="86" y="74" width="84" height="150" rx="20"
        fill="url(#body)" stroke="#1f2328" stroke-width="5"/>

  <!-- label panel -->
  <rect x="98" y="104" width="60" height="104" rx="10"
        fill="#eef3f7" stroke="#1f2328" stroke-width="3.5"/>

  <!-- ===== LEFT: status LEDs (vertical column) ===== -->
  <circle cx="110" cy="118" r="5" fill="#5aa832" stroke="#1f2328" stroke-width="2"/>
  <circle cx="110" cy="133" r="5" fill="#1a4fa0" stroke="#1f2328" stroke-width="2"/>
  <circle cx="110" cy="148" r="5" fill="#1a4fa0" stroke="#1f2328" stroke-width="2"/>
  <circle cx="110" cy="163" r="5" fill="#cfd8df" stroke="#1f2328" stroke-width="2"/>

  <!-- ===== LEFT-BOTTOM: wifi fan ===== -->
  <g fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round">
    <path d="M100 188 A12 12 0 0 1 120 188"/>
    <path d="M105 192 A6.5 6.5 0 0 1 115 192"/>
  </g>
  <circle cx="110" cy="196" r="2.5" fill="#1f2328"/>

  <!-- ===== RIGHT: vertical wordmark (rotated, reads bottom-to-top) ===== -->
  <text x="144" y="156" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700"
        fill="#1a4fa0" transform="rotate(-90 144 156)">Solar Plug-RWB1</text>
</svg>
